<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<title>WorkShifts.com - Find your next job</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f3f2f1}
.top{border-bottom:2px solid #ececec;background:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#0B5CFF;font-weight:900;font-size:26px}
.nav a{margin:0 8px;color:#333;text-decoration:none;font-size:14px}
.btn{padding:8px 14px;border-radius:20px;border:1px solid #0B5CFF;cursor:pointer;font-weight:bold}
.btn-blue{background:#0B5CFF;color:#fff}
.hero{background:#D6E4FF;padding:32px 20px;text-align:center}
.hero h1{font-size:32px;margin-bottom:16px}
.hero input{padding:14px 16px;width:280px;border-radius:8px;border:1px solid #aaa;margin:5px}
.hero button{padding:14px 22px;background:#0B5CFF;color:#fff;border:none;border-radius:8px;font-weight:bold}
.list{max-width:950px;margin:20px auto;padding:0 15px}
.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin-bottom:12px;display:flex;gap:14px}
.card:hover{border-color:#0B5CFF}
.icon{width:48px;height:48px;border-radius:8px;background:#2557a7;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}
.card h3{color:#0B5CFF}
.card a{color:#0B5CFF;text-decoration:none}
